version: 1
name: Apple iCloud
slug: apple-icloud
summary: >-
  Apple Music playlists and library, iCloud Calendar, Contacts and Mail,
  Apple Maps, WeatherKit and iTunes search for Claude — no Mac required.
  Unofficial; not affiliated with Apple.
#
# Owner-level settings go in `env` (the Apple Developer key is the owner's:
# it identifies the developer account, not the listener). Everything
# personal goes in `auth.fields`, asked at /authorize and remembered per
# person — declaring them gives every caller their own child process and
# data directory, so one person's Apple ID never reaches another's tools.
# People who do not have the developer key can still get an Apple Music
# user token: the owner runs `music-auth --print-developer-token` and hands
# out the short-lived token it prints (never the .p8).
env:
  - name: APPLE_TEAM_ID
    required: false
    help: >-
      Your Apple Developer Team ID (10 characters). Needed for Apple Music
      (official API), Apple Maps and WeatherKit.
  - name: APPLE_KEY_ID
    required: false
    help: >-
      Key ID of a private key created in Certificates, Identifiers & Profiles →
      Keys with Media Services (MusicKit), MapKit JS and/or WeatherKit enabled.
  - name: APPLE_PRIVATE_KEY
    secret: true
    required: false
    help: >-
      Contents of that key's .p8 file (PEM; one-line values with \n escapes and
      base64 are accepted).
  - name: APPLE_WEATHERKIT_SERVICE_ID
    required: false
    help: >-
      WeatherKit only: the Services ID registered for WeatherKit (e.g.
      com.example.weather).
  - name: APPLE_WRITE_MODE
    required: false
    help: >-
      "none" = read-only tools; "additive" = also create/append, never modify,
      delete or send; "all" = everything (default). Unrecognized values fail
      closed to "none".
  - name: APPLE_SERVICES
    required: false
    help: >-
      Comma-separated services to enable (music, calendar, contacts, mail, maps,
      weather, itunes). Default: all.
  - name: APPLE_UNITS
    required: false
    help: >-
      "metric" (default) or "imperial" units for weather (Maps distances always
      show both).
  - name: MCP_CONFIRM_MODE
    required: false
    help: >-
      How confirm-gated writes (send mail, deletes, removing tracks,
      invitations) behave on a client with no prompt, like claude.ai: "ask-user"
      (default: preview + confirmToken, the model must get your OK), "auto", or
      "refuse". Unknown values mean refuse.
  - name: MCP_CONFIRM_SECRET
    secret: true
    required: false
    help: >-
      Signing key for confirmTokens. Optional on mcp-host, which already gives
      each child a stable key (MCP_HOST_CONFIRM_SECRET) so a token issued just
      before a restart or redeploy still works; this overrides it. Spent tokens
      are recorded on disk, so none can be replayed.
auth:
  fields:
    - name: APPLE_MUSIC_USER_TOKEN
      label: "Apple Music user token (official API)"
      type: password
      required: false
      persist: user
      help: "Music User Token for your library (official API), from a one-time MusicKit sign-in: `npx apple-icloud-mcp music-auth`. Without the Apple Developer key, ask the owner for a developer token (music-auth --print-developer-token) and run it with APPLE_MUSIC_DEVELOPER_TOKEN set. Lasts ~6 months."
    - name: APPLE_MUSIC_WEB_USER_TOKEN
      label: "Apple Music web session token (unofficial)"
      type: password
      required: false
      persist: user
      help: "Opt-in web-player mode (no developer account needed; unlocks rename/delete/remove/reorder): the media-user-token cookie from a signed-in music.apple.com tab."
    - name: APPLE_MUSIC_STOREFRONT
      label: "Apple Music storefront (country)"
      type: text
      required: false
      persist: user
      help: "Two-letter Apple Music storefront (e.g. us, gb). Default: your account's storefront, else us."
    - name: ICLOUD_USERNAME
      label: "Apple ID email"
      type: text
      autofill: username
      required: false
      persist: user
      help: "Your Apple ID email, for iCloud Calendar, Contacts and Mail."
    - name: ICLOUD_APP_PASSWORD
      label: "iCloud app-specific password"
      type: password
      required: false
      persist: user
      help: "An app-specific password from appleid.apple.com → Sign-In and Security → App-Specific Passwords (NOT your Apple ID password)."
    - name: ICLOUD_MAIL_ADDRESS
      label: "iCloud Mail address"
      type: text
      required: false
      persist: user
      help: "Your @icloud.com address, only if your Apple ID email is not an iCloud address (needed for Mail)."
    - name: ICLOUD_DEFAULT_CALENDAR
      label: "Default calendar for new events"
      type: text
      required: false
      persist: user
      help: "Calendar new events go to when none is named (default: the first writable event calendar)."
    - name: DISPLAY_TZ
      label: "Your time zone"
      type: text
      required: false
      persist: user
      help: "IANA time zone (e.g. America/New_York) for displayed times and for dates you give without an offset. Set this on a hosted server, which runs in UTC."
state:
  dataDir: true
  reason: >-
    Small caches that make a scale-to-zero cold start cheap and safe: the
    Apple Music web-player developer token (otherwise re-scraped from
    music.apple.com on every start), iCloud CalDAV/CardDAV discovery results,
    which IMAP login form worked, digests of rejected iCloud passwords (so a
    revoked one is not re-sent on every start) and spent confirmation tokens
    (so none can be replayed after a restart). Files live under
    $MCP_DATA_DIR/.apple-icloud-mcp, mode 0600, and hold no personal credential.
egress:
  allow:
    - api.music.apple.com
    - amp-api.music.apple.com
    - music.apple.com
    - caldav.icloud.com
    - contacts.icloud.com
    - "*.icloud.com"
    - imap.mail.me.com
    - smtp.mail.me.com
    - maps-api.apple.com
    - weatherkit.apple.com
    - itunes.apple.com
    - rss.marketingtools.apple.com
